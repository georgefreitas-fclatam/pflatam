<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cybersecurity Awareness</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f4f6f8;
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2937;
      }

      table {
        border-spacing: 0;
      }

      img {
        border: 0;
        display: block;
        max-width: 100%;
        height: auto;
      }

      .wrapper {
        width: 100%;
        table-layout: fixed;
        background-color: #f4f6f8;
        padding: 20px 0;
      }

      .main {
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        background-color: #ffffff;
      }

      .content {
        padding: 0;
      }

      .image-link {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <table role="presentation" class="wrapper" width="100%">
      <tr>
        <td align="center">
          <table role="presentation" class="main" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td class="content">
                <a href="https://example.com" class="image-link" target="_blank" rel="noopener noreferrer">
                  <img
                    src="./E-mail%20Cybersecurity%20Awareness_Edit%C3%A1vel.png"
                    alt="Cybersecurity Awareness"
                    width="640"
                    style="width: 100%; max-width: 640px; height: auto;"
                  />
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
